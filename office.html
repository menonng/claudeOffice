<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<style>
:root{
  --red:#FF0045; --orange:#FF7E00; --yellow:#FFCC11; --green:#55BB44;
  --sky:#39C5BB; --blue:#3355BB; --purple:#660099; --pink:#FFB4CC;
  --bg:#eef0f6; --card:#ffffff; --text:#1d2033; --muted:#727795; --line:#e3e5ee; --soft:#f5f6fa;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11131b; --card:#1b1d29; --text:#eceef8; --muted:#9a9fbe; --line:#2b2e41; --soft:#232637; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:12px;padding:12px;height:100vh}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;min-height:0}
.sec{padding:12px 14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.sec h3 small{margin-left:auto;font-weight:500;color:var(--muted);font-size:11px}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:0}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.stage{background:linear-gradient(180deg,#f4f6fb,#e7eaf3)}
@media (prefers-color-scheme: dark){.stage{background:linear-gradient(180deg,#1b1e2c,#141622)}}
.top{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:7px 12px 7px 8px;box-shadow:0 4px 14px rgba(20,24,50,.08);max-width:calc(100% - 120px)}
.top .fl{font-weight:800;font-size:12px;color:#fff;background:var(--blue);border-radius:8px;padding:3px 7px}
.top b{font-size:14px}
.top div{min-width:0}
.top span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{position:absolute;right:12px;top:14px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
  color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.live.on{color:var(--green)} .live.on i{background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.ctrl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.ctrl button,.mode button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  width:34px;height:34px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(20,24,50,.06)}
.mode{position:absolute;right:12px;bottom:12px;display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.mode button{width:auto;height:30px;padding:0 12px;font-size:12px;font-weight:700;border:0;box-shadow:none;background:transparent;color:var(--muted)}
.mode button.on{background:var(--blue);color:#fff}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.empty div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:13px;line-height:1.6;text-align:center;color:var(--muted)}
.empty.show{display:flex}
/* 층별 안내 */
.floor{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.floor.sel{border-color:var(--orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 25%,transparent)}
.fh{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.fh .no{font-size:11px;font-weight:800;border-radius:7px;padding:3px 6px;color:#fff;background:var(--muted)}
.floor.sel .fh .no{background:var(--orange)}
.fh b{font-size:13px;display:block}
.fh span{font-size:11px;color:var(--muted)}
.fh .dot{width:7px;height:7px;border-radius:50%;margin-left:auto;background:var(--line)}
.fh .dot.on{background:var(--green)}
.slist{border-top:1px solid var(--line);padding:4px}
.srow{display:flex;gap:6px;align-items:center;font-size:12px;padding:6px 6px;border-radius:8px;cursor:pointer}
.srow:hover{background:var(--soft)}
.srow.sel{background:color-mix(in srgb,var(--orange) 14%,transparent);font-weight:700}
.srow em{font-style:normal;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small{color:var(--muted);font-size:10px;white-space:nowrap}
.srow .w{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.follow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px;cursor:pointer}
/* 사람들 */
.kv{font-size:11px;color:var(--muted);display:grid;grid-template-columns:44px 1fr;gap:3px 6px;word-break:break-all}
.kv b{color:var(--text);font-weight:600;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.person{display:grid;grid-template-columns:30px 1fr auto;gap:2px 9px;padding:9px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;grid-row:span 3}
.person b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;color:#fff;white-space:nowrap;align-self:start}
.person .d{grid-column:2 / 4;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .d.stuck{color:var(--red)}
.person .m{grid-column:2 / 4;font-size:10px;color:var(--muted)}
.log{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:7px 0;border-top:1px dashed var(--line);font-size:11px}
.log:first-of-type{border-top:0}
.log time{color:var(--muted);font-size:10px;white-space:nowrap}
.log b{font-size:11px}
.log p{grid-column:1 / 3;margin:0;color:var(--muted);line-height:1.45;word-break:break-all}
.log.error p{color:var(--red)}
.log.say p{color:var(--text)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.legend div{font-size:11px;color:var(--muted);display:grid;grid-template-columns:10px 1fr;gap:2px 6px;line-height:1.35}
.legend i{width:10px;height:10px;border-radius:3px;margin-top:2px}
.legend b{color:var(--text);font-size:12px}
.legend span{grid-column:2}
@media (max-width:1100px){ .app{grid-template-columns:200px minmax(0,1fr) 260px} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:66vh;order:1} #left{order:2} #right{order:3}
  #logs{max-height:320px;overflow:auto}
}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div class="app">
  <aside id="left">
    <div class="sec">
      <h3>🏢 층별 안내 <small>FLOOR GUIDE</small></h3>
      <label class="follow"><input type="checkbox" id="follow"> 최근 세션 자동으로 따라가기</label>
      <div id="floors"></div>
    </div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="ov"></canvas>
    <div class="top"><span class="fl" id="flNo">–</span><div><b id="flName">Claude Office</b><span id="flTitle">연결 중…</span></div></div>
    <div class="live" id="live"><i></i>LIVE</div>
    <div class="ctrl"><button id="zin" title="확대">＋</button><button id="zout" title="축소">－</button><button id="zfit" title="처음 시점">⌂</button></div>
    <div class="mode"><button data-m="human">🧑 사람</button><button data-m="mascot">👾 Clawd</button></div>
    <div class="empty" id="empty"><div id="emptyMsg"></div></div>
  </div>

  <aside id="right">
    <div class="sec"><div class="kv" id="info"></div></div>
    <div class="sec"><h3>사무실 사람들 <small id="pcount"></small></h3><div id="people"></div></div>
    <div class="sec"><h3>활동 로그</h3><div id="logs"></div></div>
    <div class="sec"><h3>어디서 무엇을 하나</h3><div class="legend" id="legend"></div></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';

// ───────── 팔레트 ─────────
const PAL={red:'#FF0045',orange:'#FF7E00',yellow:'#FFCC11',green:'#55BB44',sky:'#39C5BB',blue:'#3355BB',purple:'#660099',pink:'#FFB4CC'};
const SUB_COLORS=[PAL.green,PAL.purple,PAL.sky,PAL.red,PAL.orange,PAL.pink,PAL.yellow];
const HAIRS=['#2b1d14','#4a2f1c','#1d1d2b','#7a4a22','#3b2a4a'];
const SKIN='#f6d2b0';
const BOOKC=[PAL.red,PAL.orange,PAL.yellow,PAL.green,PAL.sky,PAL.blue,PAL.purple,PAL.pink];
function shade(hex,amt){const n=parseInt(hex.slice(1,7),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt>0?255:0,a=Math.abs(amt);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

// ───────── 평면도 (1칸 = 1m, 격자 x → 3D x, 격자 y → 3D z) ─────────
const GW=30,GH=22;
const ROOMS={
  meeting:{x:0,y:0,w:7,d:7,name:'회의실',en:'MEETING',color:PAL.green,what:'계획 · 할 일 · 스킬',floor:'#dbe7d3'},
  library:{x:7,y:0,w:7,d:7,name:'자료실',en:'LIBRARY',color:PAL.orange,what:'파일 읽기 · 검색',floor:'#e9d5b4',tex:'wood'},
  dev:{x:14,y:0,w:16,d:10,name:'개발실',en:'DEV',color:PAL.blue,what:'코드 작성 · 수정',floor:'#d9e0ee',tex:'carpet'},
  elevator:{x:0,y:7,w:7,d:3,name:'엘리베이터 홀',en:'',color:PAL.sky,what:'서브에이전트 출퇴근',floor:'#ecebe4',tex:'marble'},
  lounge:{x:0,y:10,w:7,d:7,name:'라운지 · 탕비실',en:'',color:PAL.pink,what:'휴식 · 다음 지시 대기',floor:'#f1dfd3',tex:'wood'},
  copy:{x:0,y:17,w:7,d:5,name:'복사실',en:'',color:PAL.yellow,what:'',floor:'#e4e5ea'},
  mydesk:{x:8.6,y:10.4,w:7,d:3.9,name:'내 자리',en:'MY DESK',color:PAL.yellow,what:'질문 · 에이전트 호출 · 보고',floor:'#f6e7b4',rug:true},
  server:{x:22,y:12,w:8,d:6,name:'서버실',en:'SERVER',color:PAL.purple,what:'명령 실행 · git',floor:'#cfcadf',tex:'raised'},
  info:{x:10,y:15.5,w:10,d:6.5,name:'정보검색실',en:'SEARCH',color:PAL.sky,what:'웹 · 외부 도구',floor:'#d5ece9'},
};
const WALLS=[
  {x0:7,y0:0,x1:7,y1:7,k:'solid'},
  {x0:0,y0:7,x1:7,y1:7,k:'glass',g:[[4.4,5.8]]},
  {x0:7,y0:7,x1:14,y1:7,k:'solid',g:[[9.8,11.2]]},
  {x0:14,y0:0,x1:14,y1:10,k:'solid'},
  {x0:14,y0:10,x1:30,y1:10,k:'glass',g:[[17.6,19.2],[25.4,27]]},
  {x0:3,y0:10,x1:7,y1:10,k:'solid'},
  {x0:7,y0:10,x1:7,y1:17,k:'solid',g:[[12.3,13.7]]},
  {x0:0,y0:17,x1:7,y1:17,k:'solid',g:[[3,4.3]]},
  {x0:7,y0:17,x1:7,y1:22,k:'solid',g:[[19,20.3]]},
  {x0:22,y0:12,x1:30,y1:12,k:'solid'},
  {x0:22,y0:12,x1:22,y1:18,k:'solid',g:[[14.5,15.8]]},
  {x0:22,y0:18,x1:30,y1:18,k:'glass'},
  {x0:10,y0:15.5,x1:20,y1:15.5,k:'glass',g:[[14.6,16.1]]},
  {x0:10,y0:15.5,x1:10,y1:22,k:'solid'},
  {x0:20,y0:15.5,x1:20,y1:22,k:'glass',g:[[17.6,19]]},
];
// 자리: [x, y, 바라보는 방향(rad, 0=+y쪽), 앉기]
const PI=Math.PI, N=PI, S=0, E=PI/2, W=-PI/2;
const DEV_ROWS=[2.0,5.6], devSeats=[];
for(const row of DEV_ROWS)for(let k=0;k<9;k++)devSeats.push([15.825+k*1.65,row+1.6,N,1]);
const SLOTS={
  meeting:[[2.3,2.05,S,1],[3.6,2.05,S,1],[4.9,2.05,S,1],[2.3,4.75,N,1],[3.6,4.75,N,1],[4.9,4.75,N,1],[1.05,3.4,E,1],[6.15,3.4,W,1]],
  library:[[8.3,1.5,N],[10.5,1.5,N],[12.7,1.5,N],[8.9,5.05,N,1],[10.3,5.05,N,1],[11.7,5.05,N,1],[13.5,4.6,S]],
  dev:devSeats,
  server:[[23.9,14.0,N],[25.3,14.0,N],[26.7,14.0,N],[28.1,14.0,N],[23.9,16.8,N],[25.3,16.8,N],[26.7,16.8,N]],
  info:[[11.2,16.9,N],[13,16.9,N],[16.8,16.9,N],[18.6,16.9,N],[12,20.15,N,1],[15,20.15,N,1],[18,20.15,N,1]],
  mydesk:[[12.5,12.8,N],[11.1,12.9,N],[13.9,12.9,N],[9.8,13.6,N],[15,13.6,N]],
  lounge:[[2.4,12.9,2.36],[3.7,12.9,-2.28],[1.25,13.6,W],[4.0,16.15,N,1],[6.15,14.6,W,1],[5.5,11.2,2.2]],
  elevator:[[1.6,8.5,E],[2.5,7.8,E],[2.5,9.2,E]],
};
const ELEV={x:0.45,y:8.5}, USER_SEAT={x:12.5,y:10.7};

// ───────── three.js 기본 ─────────
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const glc=renderer.domElement;glc.id='gl';stage.prepend(glc);
const ov=document.getElementById('ov'),octx=ov.getContext('2d');
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-200,400);
scene.add(new THREE.HemisphereLight('#ffffff','#b9bdd0',1.55));
const sun=new THREE.DirectionalLight('#fff6e8',2.1);
sun.position.set(GW*0.5-9,26,GH*0.5+14);sun.target.position.set(GW/2,0,GH/2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:80});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

// 재질/형상 캐시
const MATS=new Map();
function mat(color,o={}){const key=color+JSON.stringify(o);if(!MATS.has(key)){
  const m=new THREE.MeshStandardMaterial({color,roughness:o.rough??0.75,metalness:o.metal??0,
    emissive:o.emissive||'#000000',emissiveIntensity:o.ei??1,transparent:o.opacity!=null,opacity:o.opacity??1,depthWrite:o.opacity==null});
  MATS.set(key,m);}return MATS.get(key);}
const BOX=new THREE.BoxGeometry(1,1,1);
const GEOS=new Map();const geo=(k,f)=>{if(!GEOS.has(k))GEOS.set(k,f());return GEOS.get(k);};
const world=new THREE.Group();scene.add(world);
function mesh(g,m,parent=world,shadow=true){const o=new THREE.Mesh(g,m);o.castShadow=shadow;o.receiveShadow=true;parent.add(o);return o;}
// 격자 좌표 상자: (x,y)=모서리, w×d 바닥, h 높이, z 바닥에서 띄운 높이
function box(x,y,w,d,h,color,z=0,o={},parent=world){const m=mesh(BOX,o.material||mat(color,o),parent,o.shadow??true);
  m.scale.set(w,h,d);m.position.set(x+w/2,z+h/2,y+d/2);return m;}
function cyl(x,y,r,h,color,z=0,o={},parent=world){const m=mesh(geo('c'+(o.seg||20),()=>new THREE.CylinderGeometry(1,1,1,o.seg||20)),o.material||mat(color,o),parent,o.shadow??true);
  m.scale.set(r,h,r);m.position.set(x,z+h/2,y);return m;}
function sph(x,y,z,r,color,o={},parent=world){const m=mesh(geo('s',()=>new THREE.SphereGeometry(1,20,14)),o.material||mat(color,o),parent,o.shadow??true);
  m.scale.set(r*(o.sx||1),r*(o.sy||1),r*(o.sz||1));m.position.set(x,z,y);return m;}
const SOLID=[];const block=(x,y,w,d)=>SOLID.push([x,y,w,d]);

// 바닥 질감 (캔버스 텍스처)
function texture(kind,base){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,128);
  if(kind==='wood'){for(let i=0;i<8;i++){g.fillStyle=shade(base,(i%3-1)*0.04);g.fillRect(0,i*16,128,15);g.fillStyle=shade(base,-0.12);g.fillRect(0,i*16+15,128,1);
    g.fillRect(((i*53)%128),i*16,1,15);}}
  else if(kind==='raised'){g.strokeStyle=shade(base,-0.18);g.lineWidth=3;for(let i=0;i<=128;i+=64){g.strokeRect(i,0,64,128);g.strokeRect(0,i,128,64);}
    g.fillStyle=shade(base,-0.25);for(const [x,y] of [[16,16],[80,16],[16,80],[80,80]]){for(let k=0;k<4;k++)g.fillRect(x+k*8,y,4,30);}}
  else if(kind==='carpet'){for(let i=0;i<2200;i++){g.fillStyle=Math.random()<.5?shade(base,-0.05):shade(base,0.05);g.fillRect(Math.random()*128,Math.random()*128,1.5,1.5);}
    g.strokeStyle=shade(base,-0.07);g.strokeRect(0,0,128,128);}
  else if(kind==='marble'){g.strokeStyle=shade(base,-0.08);g.lineWidth=2;g.strokeRect(0,0,128,128);g.strokeStyle=shade(base,-0.05);g.lineWidth=1;
    for(let i=0;i<5;i++){g.beginPath();g.moveTo(Math.random()*128,0);g.bezierCurveTo(Math.random()*128,40,Math.random()*128,90,Math.random()*128,128);g.stroke();}}
  else{g.strokeStyle=shade(base,-0.06);g.lineWidth=2;g.strokeRect(0,0,128,128);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
function floorRect(x,y,w,d,color,kind,z=0.002,rep=1){const t=texture(kind,color);t.repeat.set(w/rep,d/rep);
  const m=mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({map:t,roughness:0.9}),world,false);
  m.rotation.x=-Math.PI/2;m.position.set(x+w/2,z,y+d/2);return m;}

// ───────── 벽 ─────────
const WALL_H=1.1,GLASS_H=2.3,EXT_H=3.2;
const SEGS=[];
const ext={}; // 바깥 벽 그룹 (카메라 방향에 따라 숨김)
function buildWalls(){
  // 바닥판
  box(-0.25,-0.25,GW+0.5,GH+0.5,0.35,'#d3d6e1',-0.35);
  floorRect(0,0,GW,GH,'#eceef3','tile',0.001,1);
  for(const [k,R] of Object.entries(ROOMS)){
    if(R.rug){floorRect(R.x,R.y,R.w,R.d,R.floor,'plain',0.004,R.w);continue;}
    floorRect(R.x,R.y,R.w,R.d,R.floor,R.tex||'tile',0.003,R.tex==='wood'?2:R.tex==='raised'?1.2:R.tex==='marble'?1.5:1);}

  const push=(n,f)=>{heap.push([f,n]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;
    if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top;};

  if(md.propPose!==p){addProp(md,p==='read'||p==='browse'||p==='coffee'?p:'');md.propPose=p;}
  const sw=walking?Math.sin(t*9+c.seed):0;
  const lerp=(o,v)=>o+(v-o)*Math.min(1,dt*10);
  if(!hu){poseClawd(c,md,a,p,t,sit,walking,sw,lerp);return;}
  md.legs.forEach((L,i)=>{const s=i?1:-1;L.rotation.x=sit?-PI/2:sw*0.6*s;});
  // 팔

  else if(p==='type'){la=ra=-1.25+Math.sin(t*14+c.seed)*0.12;laz=0.15;raz=-0.15;}
  else if(p==='rack'){ra=-2.6+Math.sin(t*3+c.seed)*0.25;la=-0.3;}
  else if(p==='meet'){const up=Math.floor(t*1.6+c.seed)%2;(up?(la=-2.4):(ra=-2.4));}
  else if(p==='think'){ra=-2.2;raz=0.5;}
  else if(p==='coffee'){ra=-1.3;raz=-0.2;}
  else if(p==='talk'||p==='ask'){ra=-0.6+Math.sin(t*4+c.seed)*0.4;}
  md.arms[0].rotation.x=lerp(md.arms[0].rotation.x,la);md.arms[1].rotation.x=lerp(md.arms[1].rotation.x,ra);
  md.arms[0].rotation.z=lerp(md.arms[0].rotation.z,laz);md.arms[1].rotation.z=lerp(md.arms[1].rotation.z,raz);
  md.hip.position.y=sit?0.5:0.78;md.torso.position.y=sit?0.5:0.78+(walking?Math.abs(sw)*0.03:0);
  md.head.rotation.x=p==='read'||p==='browse'||p==='type'?0.25:p==='think'?-0.1:0;md.head.rotation.z=p==='think'?0.15:0;

}
// Clawd: 다리 8개를 번갈아 들며 걷고, 팔(옆 돌기)을 위아래로 흔든다. 고민 중엔 눈이 위로, 막히면 눈이 찌그러지고 몸이 떨린다
function poseClawd(c,md,a,p,t,sit,walking,sw,lerp){
  md.legs.forEach((L,i)=>{L.position.y=L.userData.y+(walking?Math.max(0,Math.sin(t*12+c.seed+(((i>>1)+(i&1))%2)*PI))*0.05:0);});
  const think=a.busy&&!a.stuck&&!walking;
  md.torso.position.y=(sit?CLAWD_SIT/md.sc:0)+(walking?Math.abs(sw)*0.06:think?Math.abs(Math.sin(t*3+c.seed))*0.025:0);
  md.torso.position.x=a.stuck&&!walking?Math.sin(t*40)*0.012:0;
  md.torso.rotation.x=lerp(md.torso.rotation.x,p==='read'||p==='browse'||p==='type'?0.12:0);
  // 팔: up>0 이면 끝이 올라감, fwd>0 이면 앞으로 모음
  let lu=walking?sw*0.35:0,ru=walking?-sw*0.35:0,fwd=0;
  if(p==='read'||p==='browse'){lu=ru=0.3;fwd=0.7;}
  else if(p==='type'){lu=0.1+Math.sin(t*16+c.seed)*0.25;ru=0.1-Math.sin(t*16+c.seed)*0.25;fwd=0.3;}
  else if(p==='rack'){ru=1.1+Math.sin(t*3+c.seed)*0.25;lu=-0.1;}
  else if(p==='meet'){Math.floor(t*1.6+c.seed)%2?(lu=1.2):(ru=1.2);}
  else if(p==='think'){ru=0.9+Math.sin(t*5)*0.1;}
  else if(p==='talk'||p==='ask'){ru=0.4+Math.sin(t*4+c.seed)*0.4;}
  md.arms.forEach((A,i)=>{const s=i?1:-1;A.rotation.z=lerp(A.rotation.z,s*(i?ru:lu));A.rotation.y=lerp(A.rotation.y,-s*fwd);});
  const blink=((t+c.seed*0.37)%4.2)<0.13;
  md.eyes.forEach(e=>{e.scale.y=CLAWD_PH*(a.stuck?0.35:blink?0.12:1);e.position.y=e.userData.y+(think?0.025:0);});
}

const chars=new Map();let elevOpen=0;

  data:{name:'나',pose:'type',detail:'',sub:false},user:true,sit:true};
function pickSelected(){const ss=D.sessions;if(!ss.length){selected=null;return;}
  if(follow){const cur=ss.find(s=>s.id===selected),now=(Date.now()+serverOffset)/1000;
    if(cur&&cur.working)return;const w=ss.filter(s=>s.working).sort((a,b)=>b.last-a.last)[0];
    if(w&&(!cur||now-cur.last>20)){selected=w.id;return;}if(!cur)selected=(ss.find(s=>s.present)||ss[0]).id;return;}
  if(!ss.some(s=>s.id===selected))selected=(ss.find(s=>s.present)||ss[0]).id;}
function applySnapshot(msg){
  serverOffset=msg.now*1000-Date.now();D=msg;userChar.data.name=msg.user||'나';
  const prev=selected;pickSelected();const instant=prev!==selected;
  if(instant){for(const c of chars.values())dropModel(c);chars.clear();}
  const visible=D.agents.filter(a=>a.session===selected);
  const groups={};for(const a of visible)(groups[a.room]=groups[a.room]||[]).push(a);
  const seen=new Set();
  for(const a of visible){seen.add(a.id);let c=chars.get(a.id);
    const g=groups[a.room],i=g.indexOf(a),sl=SLOTS[a.room]||SLOTS.mydesk,s=sl[i%sl.length],lap=Math.floor(i/sl.length);
    const tx=s[0]+lap*0.4,ty=s[1]+lap*0.4;

      const color=a.sub?SUB_COLORS[([...chars.values()].filter(x=>x.data.sub).length+seed)%SUB_COLORS.length]:PAL.blue;
      c={id:a.id,x:instant?tx:ELEV.x,y:instant?ty:ELEV.y,path:[],alpha:instant?1:0,color,hair:HAIRS[seed%HAIRS.length],seed,
        room:instant?a.room:'elevator',goal:null,face:instant?s[2]:E,faceTarget:s[2],sit:false,data:a};chars.set(a.id,c);}
    c.data=a;c.leaving=false;
    if(!c.goal||c.goal.x!==tx||c.goal.y!==ty){c.goal={x:tx,y:ty,a:s[2],sit:!!s[3]};c.room=a.room;c.path=instant?[]:route(c,tx,ty);c.sit=false;
      if(instant){c.sit=!!s[3];c.faceTarget=c.face=s[2];}}
  }

    c.goal={x:ELEV.x,y:ELEV.y,a:W,sit:false};c.room='elevator';c.sit=false;c.path=route(c,ELEV.x,ELEV.y);}

}
function angLerp(a,b,k){let d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*k;}
function update(dt,t){

    if(c.path.length){const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy),sp=2.6*dt;
      c.faceTarget=Math.atan2(dx,dy);
      if(d<=sp){c.x=p.x;c.y=p.y;c.path.shift();if(!c.path.length&&c.goal){c.faceTarget=c.goal.a;c.sit=c.goal.sit;}}else{c.x+=dx/d*sp;c.y+=dy/d*sp;}}

    md.mats.forEach(m=>{m.opacity=Math.max(0,c.alpha);m.transparent=c.alpha<0.999;m.depthWrite=c.alpha>=0.999;});
    poseModel(c,t,dt);

  ELEVATOR.l.scale.z=ELEVATOR.r.scale.z=1-elevOpen*0.9;ELEVATOR.l.position.z=7.5+(1-elevOpen*0.9)/2;ELEVATOR.r.position.z=9.5-(1-elevOpen*0.9)/2;
  ELEVATOR.lamp.material=elevOpen>0.05?mat(PAL.yellow,{emissive:PAL.yellow,ei:1}):mat('#4a4f68');
  // 모니터: 앉아서 일하는 자리만 켜기
  for(const mo of MONITORS){const on=[...chars.values()].some(c=>!c.path.length&&c.room==='dev'&&Math.abs(c.x-mo.x)<0.3&&Math.abs(c.y-mo.y)<0.3);

function agoShort(ts){const s=Math.max(0,Math.round((Date.now()+serverOffset)/1000-ts));return s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`:`${Math.floor(s/3600)}h`;}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function floorsOf(){const by=new Map();for(const s of D.sessions){if(!by.has(s.project))by.set(s.project,[]);by.get(s.project).push(s);}
  const fl=[...by.entries()].map(([p,ss])=>({p,ss,last:Math.max(...ss.map(x=>x.last)),working:ss.some(x=>x.working)}));
  fl.sort((a,b)=>b.p.localeCompare(a.p));fl.forEach((f,i)=>f.no=fl.length-i);return fl;}  // 층 번호는 이름순으로 고정
let openFloor=null;
function renderSide(){
  const fl=floorsOf(),cur=D.sessions.find(s=>s.id===selected),curF=cur&&fl.find(f=>f.p===cur.project);
  // 상단 칩
  $('flNo').textContent=curF?`${curF.no}F`:'–';$('flName').textContent=cur?cur.project:'Claude Office';
  $('flTitle').textContent=cur?cur.title:'아직 기록된 세션이 없어요';
  // 층별 안내
  $('floors').innerHTML=fl.map(f=>{const sel=curF&&f.p===curF.p,open=sel||openFloor===f.p;
    return `<div class="floor${sel?' sel':''}"><div class="fh" data-floor="${esc(f.p)}"><span class="no">${f.no}F</span>
      <div style="min-width:0"><b>${esc(f.p)}</b><span>세션 ${f.ss.length}개 · ${f.working?'지금 활동 중':ago(f.last)}</span></div>
      <i class="dot${f.working?' on':''}"></i></div>
      ${open?`<div class="slist">${f.ss.map(s=>`<div class="srow${s.id===selected?' sel':''}" data-sess="${s.id}">
        ${s.working?'<i class="w"></i>':''}<em>${esc(s.title)}</em><small>${s.working?'지금':ago(s.last)}</small></div>`).join('')}</div>`:''}
    </div>`;}).join('')||'<div class="kv">세션 기록이 없어요</div>';
  // 정보
  $('info').innerHTML=cur?`<span>프로젝트</span><b>${esc(cur.cwd||cur.project)}</b><span>세션</span><b>${esc(cur.session.slice(0,8))}</b>`:
    `<span>폴더</span><b>${esc(D.root||'')}</b>`;
  // 사람들
  const vis=D.agents.filter(a=>a.session===selected);
  $('pcount').textContent=vis.length?`${vis.length}명 근무 중`:'';
  $('people').innerHTML=vis.map(a=>{const c=chars.get(a.id),R=ROOMS[a.room]||ROOMS.mydesk;
    const chip=a.stuck?`<span class="chip" style="background:${PAL.red}">막힘</span>`:a.busy?`<span class="chip" style="background:${PAL.purple}">고민 중</span>`:
      `<span class="chip" style="background:${R.color}">${R.name}</span>`;
    const init=a.sub?a.name.slice(0,1):'C';
    return `<div class="person" data-id="${a.id}" style="cursor:pointer" title="눌러서 이 직원 보기"><span class="av" style="background:${c?c.color:'#999'}">${esc(init)}</span><b>${esc(a.name)}</b>${chip}
      <span class="d${a.stuck?' stuck':''}">${esc(a.busy&&!a.stuck?`💭 고민 중 · ${a.thinks}회`:a.detail)}</span>
      <span class="m">도구 ${a.tools}회 · ${agoShort(a.last)}</span></div>`;}).join('')||
      `<div class="kv">${cur?'지금은 아무도 출근해 있지 않아요':''}</div>`;
  // 활동 로그
  const lg=(D.logs[selected]||[]).slice().reverse();
  $('logs').innerHTML=lg.map(l=>{const d=new Date(l.t*1000);
    return `<div class="log ${l.kind}"><time>${d.getHours()}시 ${d.getMinutes()}분 ${d.getSeconds()}초</time>
      <b>${esc(l.who)}</b><p>${esc(l.text)}</p></div>`;}).join('')||'<div class="kv">기록 없음</div>';
  // 빈 사무실
  const em=$('empty');em.classList.toggle('show',!vis.length);
  $('emptyMsg').innerHTML=!D.sessions.length?'아직 기록된 Claude Code 세션이 없어요.<br>터미널에서 <b>claude</b>를 실행하면 출근합니다 🛗':
    cur&&!cur.present?'이 세션은 퇴근했어요 🌙<br>왼쪽에서 다른 세션을 골라보세요':'';
  if(cur&&cur.present&&!vis.length)em.classList.remove('show');
}
$('floors').addEventListener('click',e=>{
  const s=e.target.closest('[data-sess]');if(s){selected=s.dataset.sess;setFollow(false);applySnapshot(D);return;}
  const f=e.target.closest('[data-floor]');if(f){const fl=floorsOf().find(x=>x.p===f.dataset.floor);
    openFloor=f.dataset.floor;if(fl){selected=fl.ss[0].id;setFollow(false);applySnapshot(D);}}});
function setFollow(v){follow=v;$('follow').checked=v;try{localStorage.setItem('office-follow',v?'1':'0');}catch(e){}}
$('follow').checked=follow;$('follow').onchange=e=>{setFollow(e.target.checked);applySnapshot(D);};
setInterval(()=>{if(D.sessions.length)renderSide();},1000);
// 범례
$('legend').innerHTML=['library','dev','server','info','meeting','mydesk','lounge','elevator'].map(k=>{const R=ROOMS[k];
  return `<div><i style="background:${R.color}"></i><b>${R.name}</b><span>${R.what}</span></div>`;}).join('');
// 모드
function setMode(m){mode=m;document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  try{localStorage.setItem('office-mode',m);}catch(e){}}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(mode);

// ───────── SSE ─────────
function connect(){
  const es=new EventSource('/events'),live=$('live');
  es.onopen=()=>live.classList.add('on');
  es.onmessage=e=>{try{applySnapshot(JSON.parse(e.data));}catch(err){console.error(err);}};
  es.onerror=()=>live.classList.remove('on');
}
resize();connect();

</script>
</body>
</html>
